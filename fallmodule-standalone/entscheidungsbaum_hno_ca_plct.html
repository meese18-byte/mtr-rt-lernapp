  selected:null,
  pendingSit:null,
  showingSit:false,
  isEnd:false,
  endData:null,
  freitextValue:'',
  freitextSubmitted:false,
  hintChecked:[]
};

function r(){
  const root=document.getElementById('root');
  if(!root)return;
  if(S.isEnd){rEnd(root);return;}
  const node=NODES[S.node];
  if(!node)return;
  if(node.isFreitext){rFreitext(root);return;}
  if(S.showingSit&&S.pendingSit){rSitBridge(root,node);return;}
  if(node.type==='situation_bridge'){rSitBridgeNode(root,node);return;}
  rNode(root,node);
}

function prog(step){
  const segs=STEPS.map((s,i)=>`<div class="prog-seg ${i<step?'done':i===step?'active':''}"></div>`).join('');
  return`<div class="prog-bar">${segs}<span class="prog-lbl">${step+1} / ${STEPS.length}</span></div>`;
}

function trail(){
  if(!S.history.length)return'';
  const items=S.history.map(h=>`<span class="trail-item">${h}</span><span class="trail-sep">›</span>`).join('');
  return`<div class="trail">${items}</div>`;
}

function sitBox(sit){
  return`<div class="sit-box ${sit.cls||''}"><div class="sit-lbl">${sit.lbl}</div><div class="sit-txt">${sit.txt}</div></div>`;
}

function rNode(root,node){
  const sit=node.situation?`<div class="sit-box"><div class="sit-lbl">Situation</div><div class="sit-txt">${node.situation}</div></div>`:'';
  const opts=node.options.map(o=>`<button class="opt ${S.selected&&S.selected.id===o.id?'sel':''}" onclick="pick('${o.id}')" ${S.selected?'disabled':''}><span class="opt-lt">${o.id}</span><span>${o.text}</span></button>`).join('');
  const rst=S.history.length?`<div class="btn-row"><button class="btn sec" onclick="reset()">Neu starten</button></div>`:'';
  root.innerHTML=`${prog(node.step)}${trail()}${sit}<div class="q-lbl">Entscheidung</div><div class="q-txt">${node.question}</div><div class="opts">${opts}</div>${rst}`;
}

function rSitBridge(root,node){
  const next=S.selected?S.selected.next_node:'';
  const fromId=S.node;
  const optId=S.selected?S.selected.id:'';
  root.innerHTML=`${prog(node.step)}${trail()}${sitBox(S.pendingSit)}<div class="btn-row"><button class="btn p" onclick="adv('${next}','${fromId}','${optId}')">Weiter \u2192</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
}

function rSitBridgeNode(root,node){
  const opts=node.options.map(o=>`<button class="opt ${S.selected&&S.selected.id===o.id?'sel':''}" onclick="pick('${o.id}')" ${S.selected?'disabled':''}><span class="opt-lt">${o.id}</span><span>${o.text}</span></button>`).join('');
  root.innerHTML=`${prog(node.step)}${trail()}${sitBox(node.sit)}<div class="q-lbl">Entscheidung</div><div class="q-txt">${node.question}</div><div class="opts">${opts}</div><div class="btn-row"><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
}

function rEnd(root){
  const e=S.endData;
  const bc=e.type==='stop'?'end-stop':e.type==='warn'?'end-warn':'end-opt';
  const dc=e.type==='stop'?'dot-r':e.type==='warn'?'dot-a':'dot-g';
  const backBtn=e.type==='warn'&&S.nodeStack.length?`<button class="btn p" onclick="goBack()">&#8592; Entscheidung wiederholen</button>`:'';
  root.innerHTML=`${trail()}<div class="end-box ${bc}"><div class="end-hdr"><div class="end-dot ${dc}"></div><div class="end-title">${e.title}</div></div><div class="end-txt">${e.text}</div></div><div class="btn-row" style="margin-top:1rem">${backBtn}<button class="btn sec" onclick="reset()">Neu starten</button></div>`;
}

function rFreitext(root){
  const hints=FREITEXT_HINTS.map((h,i)=>`<div class="hint-row" onclick="togHint(${i})"><div class="hc ${S.hintChecked.includes(i)?'on':''}">${S.hintChecked.includes(i)?'\u2713':''}</div><span class="ht ${S.hintChecked.includes(i)?'on':''}">${h}</span></div>`).join('');
  const cnt=S.hintChecked.length;
  if(!S.freitextSubmitted){
    root.innerHTML=`${prog(6)}${trail()}<div class="sit-box highlight"><div class="sit-lbl">Abschlussaufgabe – Dokumentation</div><div class="sit-txt">Maske ist angefertigt, Herr K. toleriert sie gut. Formulieren Sie den Dokumentationseintrag für den CT-Anforderungsschein – so vollständig, dass jede Kollegin den Setup bei Fraktion 1 bis 30 eigenständig und korrekt reproduzieren kann.</div></div><div class="q-lbl">Ihr Dokumentationseintrag</div><textarea class="freitext" placeholder="Lagerung, Hilfsmittel, Besonderheiten..." oninput="S.freitextValue=this.value">${S.freitextValue}</textarea><div class="btn-row" style="margin-top:.75rem"><button class="btn p" onclick="submitFreitext()">Eintrag abgeben</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
    const ta=root.querySelector('.freitext');
    if(ta)ta.value=S.freitextValue;
  } else {
    root.innerHTML=`${prog(6)}${trail()}<div style="background:#f5f4f0;border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:14px;color:#1a1a1a;line-height:1.6;white-space:pre-wrap">${S.freitextValue||'(kein Eintrag)'}</div><div class="hint-box"><div class="hint-lbl">Erwartungshorizont – welche Punkte sind enthalten? (${cnt} / ${FREITEXT_HINTS.length})</div>${hints}<div style="font-size:12px;color:#999;margin-top:.75rem;line-height:1.6;padding:.5rem 0;border-top:0.5px solid #ddd;margin-top:.75rem">Herr K. wird es nicht sagen wenn die Maske drückt. Die Dokumentation schützt ihn.</div></div><div class="btn-row" style="margin-top:1rem"><button class="btn p" onclick="finishOpt()">Ergebnis anzeigen \u2192</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
  }
}

function pick(id){
  if(S.selected)return;
  const node=NODES[S.node];
  const opt=node.options.find(o=>o.id===id);
  S.selected=opt;
  if(opt.situation_after){
    S.nodeStack.push(S.node);
    S.pendingSit=opt.situation_after;
    S.showingSit=true;
    r();
    return;
  }
  const nextId=opt.next_node;
  const nx=NODES[nextId];
  if(nx&&(nx.type==='stop'||nx.type==='warn'||nx.type==='optimal')){
    S.nodeStack.push(S.node);
    S.history.push(S.node.toUpperCase()+'\u2192'+id);
    S.isEnd=true;
    S.endData=nx;
    r();
    return;
  }
  if(!nx){r();return;}
  S.nodeStack.push(S.node);
  S.history.push(S.node.toUpperCase()+'\u2192'+id);
  S.node=nextId;
  S.selected=null;
  r();
}

function adv(nextId,fromId,optId){
  S.nodeStack.push(fromId);
  S.history.push(fromId.toUpperCase()+'\u2192'+optId);
  const nx=NODES[nextId];
  if(!nx){r();return;}
  if(nx.type==='stop'||nx.type==='warn'||nx.type==='optimal'){
    S.isEnd=true;
    S.endData=nx;
  } else {
    S.node=nextId;
    S.selected=null;
    S.pendingSit=null;
    S.showingSit=false;
  }
  r();
}

function togHint(i){
  S.hintChecked=S.hintChecked.includes(i)?S.hintChecked.filter(x=>x!==i):[...S.hintChecked,i];
  r();
}

function submitFreitext(){
  if(!S.freitextValue.trim())return;
  S.freitextSubmitted=true;
  r();
}

function finishOpt(){
  S.isEnd=true;
  S.endData=END_OPTIMAL;
  r();
}

function reset(){
  S={node:'k1',history:[],nodeStack:[],selected:null,pendingSit:null,showingSit:false,isEnd:false,endData:null,freitextValue:'',freitextSubmitted:false,hintChecked:[]};
  r();
}

function goBack(){
  if(!S.nodeStack.length)return;
  const prev=S.nodeStack.pop();
  S.history.pop();
  S.node=prev;
  S.selected=null;
  S.pendingSit=null;
  S.showingSit=false;
  S.isEnd=false;
  S.endData=null;
  r();
}

r();
</script>
</body>
</html>
