<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entscheidungsbaum Bronchial-Ca PLCT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f0;min-height:100vh;padding:2rem 1rem}
#app{max-width:680px;margin:0 auto}
.hdr-label{font-size:11px;letter-spacing:.08em;color:#888;text-transform:uppercase;margin-bottom:.3rem}
.hdr-title{font-size:18px;font-weight:500;color:#1a1a1a;margin-bottom:1.5rem}
.prog-bar{display:flex;gap:6px;align-items:center;margin-bottom:1.25rem}
.prog-seg{height:3px;flex:1;background:#e0ddd6;border-radius:2px;transition:background .3s}
.prog-seg.done{background:#1D9E75}
.prog-seg.active{background:#9FE1CB}
.prog-lbl{font-size:11px;color:#999;white-space:nowrap}
.trail{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:1rem}
.trail-item{font-size:12px;color:#999;background:#e8e5df;border-radius:4px;padding:2px 7px}
.trail-sep{color:#ccc;font-size:11px}
.sit-box{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1.25rem;margin-bottom:1rem;animation:fi .25s ease}
.sit-box.highlight{border-left:3px solid #1D9E75}
.sit-box.warn{border-left:3px solid #EF9F27}
.sit-box.danger{border-left:3px solid #E24B4A}
.sit-box.reflex{border-left:3px solid #534AB7;background:#f8f7ff}
.sit-lbl{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
.sit-txt{font-size:15px;color:#1a1a1a;line-height:1.7}
.q-lbl{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.q-txt{font-size:15px;font-weight:500;color:#1a1a1a;line-height:1.6;margin-bottom:1rem}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
.opt{background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:.85rem 1rem;font-size:14px;color:#1a1a1a;text-align:left;cursor:pointer;line-height:1.5;transition:all .15s;display:flex;gap:.75rem;align-items:flex-start;width:100%}
.opt:hover{background:#f9f8f5;border-color:#aaa}
.opt.sel{border-color:#1D9E75;background:#f0fbf6}
.opt-lt{font-weight:500;color:#aaa;flex-shrink:0;min-width:16px}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.btn{background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:.6rem 1.25rem;font-size:14px;color:#1a1a1a;cursor:pointer;transition:all .15s}
.btn:hover{background:#f5f4f0;border-color:#aaa}
.btn.p{border-color:#1D9E75;color:#085041;font-weight:500}
.btn.p:hover{background:#f0fbf6}
.btn.sec{color:#666}
.end-box{background:#fff;border-radius:12px;padding:1.5rem;margin-top:.5rem;animation:fi .25s ease}
.end-opt{border:1.5px solid #1D9E75}
.end-warn{border:1.5px solid #EF9F27}
.end-stop{border:1.5px solid #E24B4A}
.end-hdr{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.end-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-g{background:#1D9E75}
.dot-a{background:#EF9F27}
.dot-r{background:#E24B4A}
.end-title{font-size:16px;font-weight:500;color:#1a1a1a}
.end-txt{font-size:14px;color:#444;line-height:1.8;white-space:pre-line}
.freitext{width:100%;min-height:120px;border:0.5px solid #ccc;border-radius:8px;padding:.75rem;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff;resize:vertical;line-height:1.6}
.freitext:focus{outline:none;border-color:#1D9E75}
.hint-box{background:#f5f4f0;border-radius:8px;padding:1rem;margin-top:.75rem}
.hint-lbl{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem}
.hint-row{display:flex;gap:.5rem;align-items:flex-start;font-size:13px;color:#555;line-height:1.5;margin-bottom:.35rem;cursor:pointer;padding:.2rem 0}
.hc{width:16px;height:16px;border:1.5px solid #ccc;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.hc.on{background:#1D9E75;border-color:#1D9E75;color:#fff;font-size:10px}
.ht{flex:1}
.ht.on{color:#085041}
.reflex-input{width:100%;min-height:80px;border:0.5px solid #b0a8e0;border-radius:8px;padding:.75rem;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff;resize:vertical;line-height:1.6}
.reflex-input:focus{outline:none;border-color:#534AB7}
.reflex-hints{margin-top:.75rem;font-size:13px;color:#534AB7;line-height:1.7}
.reflex-hint-item{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.3rem;cursor:pointer}
.rhc{width:15px;height:15px;border:1.5px solid #b0a8e0;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px}
.rhc.on{background:#534AB7;border-color:#534AB7;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
<div class="hdr-label">Praktische Prüfungsvorbereitung · Strahlentherapie</div>
<div class="hdr-title">Entscheidungsbaum – Planungs-CT Bronchial-Ca</div>
<div id="root"></div>
</div>
<script>
const STEPS=['k1','k2a','k2b','k3','k4','k5','k6','k7'];

// Node types:
// standard: situation + question + options
// situation_bridge: show a situation, then a "Weiter" button to next node
// reflex: reflexion pause with freitext + hints, then continues to next node
// freitext: final documentation task

const NODES={
  k1:{
    id:'k1',step:0,
    situation:'Patient mit Bronchial-Ca am Planungs-CT. Er wirkt belastet, atmet flach und schnell. Beim Versuch, ihn flach zu lagern, sagt er sofort: Ich bekomme so keine Luft. Er kennt das – er schlaeft zuhause nur noch mit erhoehtem Oberkoerper. Klinisch besteht eine O2-Pflicht. Am PLCT ist aktuell kein mobiles O2-Geraet verfuegbar.',
    question:'Was ist Ihr erster Schritt?',
    options:[
      {id:'A',text:'Patient atementlastend positionieren, Zustand beobachten, O2-Verfuegbarkeit aktiv klaeren und Ruecksprache vorbereiten.',
       next_node:'k2a',
       situation_after:{cls:'highlight',lbl:'Was passiert als naechstes',txt:'Sie richten den Patienten auf der Liege auf – halbsitzend, Oberkoerper angestuetzt. Er atmet sofort ruhiger. Er sagt: Das ist besser. Eine Kollegin bietet an, ein O2-Geraet von der Nachbarstation zu holen – ca. 10 Minuten. Der Patient ist stabil und ansprechbar. Jetzt muss die eigentliche Lagerung fuer den PLCT geplant werden.'}},
      {id:'B',text:'Patient trotzdem flach lagern und zuegig scannen – je schneller, desto kuerzer die Belastung.',
       next_node:'k1b_seq',situation_after:null},
      {id:'C',text:'Termin sofort abbrechen und Patient zurueckschicken – ohne O2 ist ein PLCT nicht vertretbar.',
       next_node:'k1c_seq',situation_after:null},
      {id:'D',text:'Oberkoerper hochlagern und scannen, sobald der Patient subjektiv sagt, es geht.',
       next_node:'k1d_seq',situation_after:null}
    ]
  },

  // K1B consequence chain
  k1b_seq:{
    id:'k1b_seq',step:0,type:'situation_bridge',
    sit:{cls:'danger',lbl:'Was passiert',txt:'Sie lagern den Patienten flach. Er beginnt sofort zu keuchen und richtet sich panisch auf. SpO2 faellt sichtbar ab. Er sagt: Ich kann nicht, ich kann nicht. Flache Rueckenlage bei Orthopnoe ist kontraindiziert – der Patient ist jetzt aufgewuehlt und verweigert jede weitere Kooperation.'},
    question:'Wie reagieren Sie jetzt?',
    options:[
      {id:'A',text:'Patient sofort hochlagern, beruhigen, Zustand stabilisieren und dann O2 organisieren.',
       next_node:'k1b_recovery',situation_after:null},
      {id:'B',text:'Scan trotzdem versuchen – der Patient muss es kurz durchhalten.',
       next_node:'end_k1b_insist',situation_after:null},
      {id:'C',text:'Arzt sofort rufen – Situation ausser Kontrolle.',
       next_node:'end_k1b_arzt',situation_after:null}
    ]
  },
  k1b_recovery:{
    id:'k1b_recovery',step:0,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Situation nach Stabilisierung',txt:'Der Patient ist wieder halbsitzend, atmet ruhiger. Er ist aber misstrauisch und nervoes. Er fragt: Muessen Sie das nochmal versuchen? O2 ist noch nicht da. Sie haben jetzt gut 15 Minuten verloren. Der naechste Patient wartet bereits.\n\nKonsequenz bis hierher: Die falsche Erstentscheidung hat Zeit gekostet, das Vertrauen des Patienten beschaedigt und den Ablauf gestresst. Die eigentliche Arbeit beginnt jetzt – aber unter schlechteren Vorzeichen.'},
    question:'Wie geht es weiter?',
    options:[
      {id:'A',text:'Situation erklaeren, Vertrauen zurueckgewinnen, O2 organisieren und Lagerung neu planen.',
       next_node:'k2a',situation_after:null},
      {id:'B',text:'Termin abbrechen und neuen Termin ueber Ambulanz und Patientlotsin koordinieren lassen.',
       next_node:'end_k1b_abbruch',situation_after:null}
    ]
  },
  end_k1b_insist:{type:'stop',title:'Scan abgebrochen – Patientensicherheit gefaehrdet',
    text:'Sie versuchen es erneut. Der Patient weigert sich kooperativ mitzumachen. SpO2 faellt weiter. Der Scan ist nicht durchfuehrbar, der Patient ist in einem schlechteren Zustand als bei Ankunft.\n\nKonsequenz: Arzt informieren, Patient sichern. Neuer Termin nur mit aerztlicher Begleitung. Die Situation haette von Beginn an anders gemanagt werden muessen.'},
  end_k1b_arzt:{type:'warn',title:'Arzt informiert – aber Eigenhandlung fehlte',
    text:'Der Arzt kommt und stabilisiert den Patienten mit Hochlagerung – genau das, was Sie bereits haetten tun koennen und sollen. Die Situation waere vermeidbar gewesen.\n\nKonsequenz: PLCT wird verschoben. Neuer Termin ueber Ambulanz und Patientlotsin. Das ist ein unnötiger organisatorischer Aufwand, der durch fruehzeitig richtiges Handeln vermeidbar gewesen waere.'},
  end_k1b_abbruch:{type:'warn',title:'Termin abgebrochen – nachvollziehbar, aber vermeidbar',
    text:'Der Abbruch ist nach dieser Eskalation verstaendlich. Aber die Ursache war die falsche Erstentscheidung – nicht die Situation selbst.\n\nNeuer Termin muss ueber Ambulanz und Patientlotsin koordiniert werden. Therapiebeginn verzoegert sich. Der Patient muss erneut anreisen.'},

  // K1C consequence chain
  k1c_seq:{
    id:'k1c_seq',step:0,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Was passiert',txt:'Sie schicken den Patienten zurueck. 20 Minuten spaeter ruft der zustaendige Arzt an: Warum wurde der Termin abgebrochen? Konnte wirklich kein O2 organisiert werden? Die Ambulanz und die Patientlotsin sind informiert – sie fragen nach der Begruendung.'},
    question:'Was antworten Sie?',
    options:[
      {id:'A',text:'Ehrlich begruenden: O2 fehlte, Patient war dyspnoisch – eine Pruefung ob O2 kurzfristig verfuegbar gewesen waere, habe ich nicht durchgefuehrt.',
       next_node:'end_k1c_ehrlich',situation_after:null},
      {id:'B',text:'Begruenden: Ohne O2 war ein sicherer PLCT nicht moeglich – das ist korrekt so.',
       next_node:'end_k1c_defend',situation_after:null}
    ]
  },
  end_k1c_ehrlich:{type:'warn',title:'Ehrliche Einschaetzung – aber vermeidbarer Aufwand',
    text:'Die ehrliche Antwort ist der richtige Umgang mit dem Fehler. Der Arzt akzeptiert die Begruendung, haelt aber fest: In solchen Faellen zuerst klaeren, ob O2 kurzfristig verfuegbar ist – dann entscheiden.\n\nKonsequenz: Neuer Termin wird ueber Ambulanz und Patientlotsin koordiniert. Therapiebeginn verzoegert sich um mehrere Tage. Vermeidbar gewesen.'},
  end_k1c_defend:{type:'warn',title:'Formal richtig – inhaltlich unvollstaendig',
    text:'Die Aussage ist nicht falsch – aber unvollstaendig. Ohne O2 haette nicht gescannt werden duerfen. Die Frage ist aber: Haette O2 in 10 Minuten verfuegbar sein koennen?\n\nDiese Pruefung hat gefehlt. Der Arzt wird nachhaken. Konsequenz: Neuer Termin, koordiniert ueber Ambulanz und Patientlotsin. Therapiebeginn verzoegert.'},

  // K1D consequence chain
  k1d_seq:{
    id:'k1d_seq',step:0,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Was passiert',txt:'Der Patient sagt, es gehe. Sie scannen. SpO2 sinkt waehrend des Scans auf 88% – Sie sehen es auf dem Monitor, sagen aber nichts. Der Scan ist technisch abgeschlossen.\n\nZwei Tage spaeter: Der Physiker meldet sich. Die Atemexkursionen im Scan sind so stark, dass die Dosisberechnung am Tumor unsicher ist. Ausserdem: keine O2-Dokumentation, keine Lagerungsbegruendung.'},
    question:'Wie reagieren Sie auf die Rueckmeldung des Physikers?',
    options:[
      {id:'A',text:'Situation offenlegen: Patient war O2-pflichtig, SpO2 war gefallen, wurde aber nicht dokumentiert.',
       next_node:'end_k1d_offen',situation_after:null},
      {id:'B',text:'Scan war technisch in Ordnung – die Entscheidung ueber Wiederholung liegt beim Arzt.',
       next_node:'end_k1d_passiv',situation_after:null}
    ]
  },
  end_k1d_offen:{type:'stop',title:'PLCT muss wiederholt werden – mit vermeidbarer Strahlenbelastung',
    text:'Die offene Rueckmeldung ist richtig. Das Ergebnis bleibt aber dasselbe: Der PLCT muss wiederholt werden – diesmal mit O2, korrekter Lagerung und vollstaendiger Dokumentation.\n\nKonsequenz: Erneute Strahlenbelastung fuer den Patienten. Neuer Termin ueber Ambulanz und Patientlotsin. Behandlungsverzoegerung. Alles vermeidbar gewesen.'},
  end_k1d_passiv:{type:'stop',title:'Verantwortung abgegeben – kein professionelles Handeln',
    text:'Die Entscheidung wird an den Arzt weitergegeben, ohne eigene Einschaetzung. Das ist keine professionelle Rueckmeldung.\n\nDer Arzt wird die Situation nachvollziehen und feststellen: SpO2-Abfall waehrend des Scans, keine O2-Dokumentation, keine Lagerungsbegruendung. PLCT wird wiederholt. Konsequenzen wie zuvor – plus Vertrauensverlust.'},

  // Optimal path continues
  k2a:{
    id:'k2a',step:1,
    situation:null,
    question:'Welche Lagerungsanpassung waehlen Sie fuer den Oberkoerper?',
    options:[
      {id:'A',text:'Nackenschale oder kleinen Keil nur unter den Kopf legen.',
       next_node:'k2a_a_seq',situation_after:null},
      {id:'B',text:'Schiefe Ebene (grosser Keil) unter den gesamten Oberkoerper legen – gleichmaessige Elevation des Rumpfes.',
       next_node:'k2b',
       situation_after:{cls:'highlight',lbl:'Was passiert als naechstes',txt:'Die Schiefe Ebene liegt. Der Oberkoerper ist gleichmaessig um ca. 30 Grad erhoht. Der Patient atmet sichtbar ruhiger, keine Atemhilfsmuskulatur mehr aktiv. Er sagt: Das ist viel besser. O2 ist noch nicht da. Jetzt muss die restliche Lagerung komplett gemacht werden – Arme und Knie.'}},
      {id:'C',text:'Weiche Schaumstoffmatte unterlegen fuer mehr Komfort.',
       next_node:'k2a_c_seq',situation_after:null},
      {id:'D',text:'Beine erhoehen zur Entspannung.',
       next_node:'k2a_d_seq',situation_after:null}
    ]
  },

  k2a_a_seq:{
    id:'k2a_a_seq',step:1,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Was passiert',txt:'Sie legen die Nackenschale unter. Der Patient liegt mit leicht erhoehtem Kopf. Nach 2 Minuten sagt er: Es ist immer noch schwer zu atmen. Die Atemhilfsmuskulatur ist weiter aktiv. Die Orthopnoe ist durch reine Kopfhochlagerung nicht ausreichend entlastet – die Atemmechanik verbessert sich nur, wenn der gesamte Rumpf erhoben wird.'},
    question:'Wie reagieren Sie?',
    options:[
      {id:'A',text:'Schiefe Ebene zusaetzlich unterlegen – Oberkoerper komplett anheben.',
       next_node:'k2b',
       situation_after:{cls:'highlight',lbl:'Korrektur greift',txt:'Mit der Schiefen Ebene verbessert sich die Atmung deutlich. Der Patient entspannt sich. Die Kopflagerung allein hat nicht gereicht – die Kombination aus Keil und Schiefer Ebene funktioniert. Weiter zur Armposition.'}},
      {id:'B',text:'Warten – vielleicht gewoehnt sich der Patient an die Position.',
       next_node:'end_k2a_warten',situation_after:null}
    ]
  },
  end_k2a_warten:{type:'warn',title:'Abwarten bei klinischem Signal – nicht vertretbar',
    text:'Der Patient gibt aktiv Rueckmeldung, dass die Atmung schwer faellt. Das ist kein Gewoehungseffekt, sondern ein klinisches Signal.\n\nKonsequenz: Lagerung muss korrigiert werden. Abwarten verlaengert die Belastung unnoetig und verzoegert den Scan weiter.'},

  k2a_c_seq:{
    id:'k2a_c_seq',step:1,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Was passiert',txt:'Die weiche Matte liegt. Der Patient wirkt etwas entspannter. Aber nach 3 Minuten sagt er: Die Luft ist immer noch knapp. Die Atemmechanik hat sich nicht verbessert – weiche Unterlagen aendern die Koerperhaltung nicht ausreichend. Zusaetzlich: Weiche Unterlagen sind fuer die taeglich reproduzierbare Bestrahlung ungeeignet.'},
    question:'Wie reagieren Sie?',
    options:[
      {id:'A',text:'Schiefe Ebene unter Matte und Patient legen – Oberkoerper anheben.',
       next_node:'k2b',
       situation_after:{cls:'highlight',lbl:'Korrektur greift',txt:'Die Schiefe Ebene hebt den Oberkoerper gleichmaessig an. Atmung verbessert sich deutlich. Die Matte wird entfernt – sie wuerde die Reproduzierbarkeit beeintraechtigen. Weiter zur Armposition.'}},
      {id:'B',text:'So belassen – der Patient sagt es sei etwas besser.',
       next_node:'end_k2a_c_belassen',situation_after:null}
    ]
  },
  end_k2a_c_belassen:{type:'warn',title:'Suboptimale Lagerung akzeptiert – Planungsproblem vorprogrammiert',
    text:'Leichte subjektive Besserung ist keine ausreichende Grundlage fuer einen Planungs-CT. Die Lagerung ist weder fuer die Atemmechanik optimal noch fuer taeglich reproduzierbare Bestrahlung geeignet.\n\nKonsequenz: Scan unter diesen Bedingungen wird in der Planung Probleme erzeugen. Rueckmeldung des Physikers oder Arztes wahrscheinlich.'},

  k2a_d_seq:{
    id:'k2a_d_seq',step:1,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Was passiert',txt:'Die Beine sind leicht erhoben. Der Patient wirkt etwas entspannter – aber atmet weiterhin angestrengt. Die Beinlagerung verbessert die Atemmechanik bei Orthopnoe in Rueckenlage nicht. Der Patient sagt nach 2 Minuten: An der Luft hat sich nichts geaendert.'},
    question:'Wie reagieren Sie?',
    options:[
      {id:'A',text:'Schiefe Ebene unterlegen – das eigentliche Problem angehen.',
       next_node:'k2b',
       situation_after:{cls:'highlight',lbl:'Richtige Massnahme greift',txt:'Schiefe Ebene liegt, Oberkoerper erhoben. Atmung deutlich besser. Die Beinlagerung bleibt als Komfortmassnahme erhalten, ist aber nicht die Loesung des Problems gewesen. Weiter zur Armposition.'}},
      {id:'B',text:'Noch mehr Beinerhöhung versuchen.',
       next_node:'end_k2a_d_mehr',situation_after:null}
    ]
  },
  end_k2a_d_mehr:{type:'warn',title:'Falsche Massnahme intensiviert – keine Besserung',
    text:'Mehr Beinerhöhung veraendert die Atemsituation nicht. Das Kernproblem – der Rueckfluss von Fluessigkeit in die Lunge bei flacher Lage – wird durch Beinlagerung nicht adressiert.\n\nKonsequenz: Zeit verloren, Patient weiter belastet. Lagerung muss neu angesetzt werden.'},

  // K2B - Arm position
  k2b:{
    id:'k2b',step:2,
    situation:null,
    question:'Wie lagern Sie Arme und Knie fuer diesen Thorax-PLCT?',
    options:[
      {id:'A',text:'Arme in Armhalterung ueber dem Kopf, Kniestep unter den Knien.',
       next_node:'k3',
       situation_after:{cls:'highlight',lbl:'Was passiert als naechstes',txt:'Lagerung steht. Arme sicher in der Armhalterung, Kniestep platziert. Der Patient haelt die Position gut. In diesem Moment kommt die Kollegin mit dem O2-Geraet zurueck. Sie schliessen es an. SpO2 steigt innerhalb von 2 Minuten auf 94%. Der Patient wirkt entspannt. Jetzt stellt sich die Frage nach der O2-Schlauchfuehrung und der weiteren Vorgehensweise.'}},
      {id:'B',text:'Arme seitlich am Koerper anlegen, Kniestep unter den Knien.',
       next_node:'k2b_b_reflex',situation_after:null},
      {id:'C',text:'Arme auf dem Bauch verschraenken, Kniestep unter den Knien.',
       next_node:'k2b_c_seq',situation_after:null},
      {id:'D',text:'Arme in Armhalterung ueber dem Kopf – kein Kniestep noetig.',
       next_node:'k2b_d_seq',situation_after:null}
    ]
  },

  // K2B-B: Reflexionspause vor dem Scan
  k2b_b_reflex:{
    id:'k2b_b_reflex',step:2,type:'reflex',
    sit:{cls:'reflex',lbl:'Reflexionspause – bevor es weitergeht',txt:'Sie haben die Arme seitlich angelegt. Bevor Sie mit dem Scan fortfahren: Diese Position weicht von der Standardlagerung fuer Thorax-PLCT ab. Nehmen Sie sich einen Moment.'},
    question:'Warum haben Sie die Arme seitlich gelagert? Und was muss jetzt zusaetzlich sichergestellt werden?',
    reflex_hints:[
      'Patient konnte Arme nicht in Armhalterung heben (z.B. Schulterarthrose, Schmerzen)',
      'Aerztliche Indikation fuer Alternativlagerung liegt vor oder wird eingeholt',
      'Dokumentation der Begruendung ist zwingend erforderlich',
      'Reproduzierbarkeit der seitlichen Armposition fuer taeglich Bestrahlung sicherstellen'
    ],
    next_node:'k2b_b_seq'
  },

  k2b_b_seq:{
    id:'k2b_b_seq',step:2,type:'situation_bridge',
    sit:{cls:'warn',lbl:'Was passiert – Planungsbesprechung',txt:'Scan ist abgeschlossen. Zwei Tage spaeter meldet sich der Physiker: Die Arme ueberlagern partiell den lateralen Thorax. Die Dosisberechnung fuer den Tumor ist an einer Stelle eingeschraenkt. Der Arzt fragt nach: Warum wurden die Arme seitlich gelagert? Liegt eine dokumentierte Begruendung vor?'},
    question:'Wie antworten Sie?',
    options:[
      {id:'A',text:'Begruendung liegt vor: Patient konnte Arme nicht heben, Arzt war informiert, dokumentiert.',
       next_node:'end_k2b_b_ok',situation_after:null},
      {id:'B',text:'Keine formale Begruendung – es schien praktisch so besser.',
       next_node:'end_k2b_b_nodoc',situation_after:null}

function r(){
  const root=document.getElementById('root');
  if(!root)return;
  if(S.isEnd){rEnd(root);return;}
  const node=NODES[S.node];
  if(!node)return;
  if(node.isFreitext){rFreitext(root);return;}
  if(node.type==='reflex'){rReflex(root,node);return;}
  if(S.showingSit&&S.pendingSit){rSitBridge(root,node);return;}
  if(node.type==='situation_bridge'){rSitBridgeNode(root,node);return;}
  rNode(root,node);
}

function prog(step){
  const segs=STEPS.map((s,i)=>`<div class="prog-seg ${i<step?'done':i===step?'active':''}"></div>`).join('');
  return `<div class="prog-bar">${segs}<span class="prog-lbl">${step+1} / ${STEPS.length}</span></div>`;
}

function trail(){
  if(!S.history.length)return'';
  const items=S.history.map(h=>`<span class="trail-item">${h}</span><span class="trail-sep">›</span>`).join('');
  return`<div class="trail">${items}</div>`;
}

function sitBox(sit){
  return`<div class="sit-box ${sit.cls||''}"><div class="sit-lbl">${sit.lbl}</div><div class="sit-txt">${sit.txt}</div></div>`;
}

function rNode(root,node){
  const sit=node.situation?`<div class="sit-box"><div class="sit-lbl">Situation</div><div class="sit-txt">${node.situation}</div></div>`:'';
  const opts=node.options.map(o=>`<button class="opt ${S.selected&&S.selected.id===o.id?'sel':''}" onclick="pick('${o.id}')" ${S.selected?'disabled':''}><span class="opt-lt">${o.id}</span><span>${o.text}</span></button>`).join('');
  const rst=S.history.length?`<div class="btn-row"><button class="btn sec" onclick="reset()">Neu starten</button></div>`:'';
  root.innerHTML=`${prog(node.step)}${trail()}${sit}<div class="q-lbl">Entscheidung</div><div class="q-txt">${node.question}</div><div class="opts">${opts}</div>${rst}`;
}

function rSitBridge(root,node){
  const next=S.selected?S.selected.next_node:'';
  const fromId=S.node;
  const optId=S.selected?S.selected.id:'';
  root.innerHTML=`${prog(node.step)}${trail()}${sitBox(S.pendingSit)}<div class="btn-row"><button class="btn p" onclick="adv('${next}','${fromId}','${optId}')">Weiter \u2192</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
}

function rSitBridgeNode(root,node){
  const opts=node.options.map(o=>`<button class="opt ${S.selected&&S.selected.id===o.id?'sel':''}" onclick="pick('${o.id}')" ${S.selected?'disabled':''}><span class="opt-lt">${o.id}</span><span>${o.text}</span></button>`).join('');
  root.innerHTML=`${prog(node.step)}${trail()}${sitBox(node.sit)}<div class="q-lbl">Entscheidung</div><div class="q-txt">${node.question}</div><div class="opts">${opts}</div><div class="btn-row"><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
}

function rReflex(root,node){
  const hints=node.reflex_hints.map((h,i)=>`<div class="reflex-hint-item" onclick="togReflex(${i})"><div class="rhc ${S.reflexChecked.includes(i)?'on':''}">${S.reflexChecked.includes(i)?'\u2713':''}</div><span>${h}</span></div>`).join('');
  if(!S.reflexSubmitted){
    root.innerHTML=`${prog(node.step)}${trail()}${sitBox(node.sit)}<div class="q-lbl">Reflexion</div><div class="q-txt">${node.question}</div><textarea class="reflex-input" placeholder="Ihre Begruendung..." oninput="S.reflexValue=this.value">${S.reflexValue}</textarea><div class="btn-row" style="margin-top:.75rem"><button class="btn p" onclick="submitReflex()">Weiter \u2192</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
    const ta=document.getElementById('reflex-input-ta');
    const tael=root.querySelector('.reflex-input');
    if(tael)tael.value=S.reflexValue;
  } else {
    root.innerHTML=`${prog(node.step)}${trail()}${sitBox(node.sit)}<div style="background:#f8f7ff;border:0.5px solid #b0a8e0;border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:14px;line-height:1.6;color:#1a1a1a;white-space:pre-wrap">${S.reflexValue||'(keine Eingabe)'}</div><div class="hint-box"><div class="hint-lbl">Orientierungspunkte – was sollte beruecksichtigt werden?</div><div class="reflex-hints">${hints}</div></div><div class="btn-row" style="margin-top:1rem"><button class="btn p" onclick="advReflex('${node.next_node}','${node.id}')">Weiter \u2192</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
  }
}

function rEnd(root){
  const e=S.endData;
  const bc=e.type==='stop'?'end-stop':e.type==='warn'?'end-warn':'end-opt';
  const dc=e.type==='stop'?'dot-r':e.type==='warn'?'dot-a':'dot-g';
  const backBtn=e.type==='warn'&&S.nodeStack.length?`<button class="btn p" onclick="goBack()">&#8592; Entscheidung wiederholen</button>`:'';
  root.innerHTML=`${trail()}<div class="end-box ${bc}"><div class="end-hdr"><div class="end-dot ${dc}"></div><div class="end-title">${e.title}</div></div><div class="end-txt">${e.text}</div></div><div class="btn-row" style="margin-top:1rem">${backBtn}<button class="btn sec" onclick="reset()">Neu starten</button></div>`;
}

function rFreitext(root){
  const hints=FREITEXT_HINTS.map((h,i)=>`<div class="hint-row" onclick="togHint(${i})"><div class="hc ${S.hintChecked.includes(i)?'on':''}">${S.hintChecked.includes(i)?'\u2713':''}</div><span class="ht ${S.hintChecked.includes(i)?'on':''}">${h}</span></div>`).join('');
  const cnt=S.hintChecked.length;
  if(!S.freitextSubmitted){
    root.innerHTML=`${prog(7)}${trail()}<div class="sit-box highlight"><div class="sit-lbl">Abschlussaufgabe</div><div class="sit-txt">Der Scan wurde erfolgreich durchgefuehrt. Formulieren Sie einen Dokumentationseintrag fuer das Behandlungsteam – so, dass die Lagerung bei jeder Fraktion reproduziert werden kann.</div></div><div class="q-lbl">Ihr Dokumentationseintrag</div><textarea class="freitext" placeholder="PLCT Thorax – Besonderheiten der Lagerung..." oninput="S.freitextValue=this.value">${S.freitextValue}</textarea><div class="btn-row" style="margin-top:.75rem"><button class="btn p" onclick="submitFreitext()">Eintrag abgeben</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
    const ta=root.querySelector('.freitext');
    if(ta)ta.value=S.freitextValue;
  } else {
    root.innerHTML=`${prog(7)}${trail()}<div style="background:#f5f4f0;border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:14px;color:#1a1a1a;line-height:1.6;white-space:pre-wrap">${S.freitextValue||'(kein Eintrag)'}</div><div class="hint-box"><div class="hint-lbl">Abgleich – welche Punkte sind enthalten? (${cnt} / ${FREITEXT_HINTS.length})</div>${hints}<div style="font-size:12px;color:#999;margin-top:.5rem">Haken Sie an, welche Aspekte Ihr Eintrag abgedeckt hat.</div></div><div class="btn-row" style="margin-top:1rem"><button class="btn p" onclick="finishOpt()">Ergebnis anzeigen \u2192</button><button class="btn sec" onclick="reset()">Neu starten</button></div>`;
  }
}

function pick(id){
  if(S.selected)return;
  const node=NODES[S.node];
  const opt=node.options.find(o=>o.id===id);
  S.selected=opt;
  if(opt.situation_after){
    S.nodeStack.push(S.node);
    S.pendingSit=opt.situation_after;
    S.showingSit=true;
    r();
    return;
  }
  const nextId=opt.next_node;
  const nx=NODES[nextId];
  if(nx&&(nx.type==='stop'||nx.type==='warn'||nx.type==='optimal')){
    S.nodeStack.push(S.node);
    S.history.push(S.node.toUpperCase()+'\u2192'+id);
    S.isEnd=true;
    S.endData=nx;
    r();
    return;
  }
  if(!nx){r();return;}
  S.nodeStack.push(S.node);
  S.history.push(S.node.toUpperCase()+'\u2192'+id);
  S.node=nextId;
  S.selected=null;
  r();
}
function adv(nextId,fromId,optId){
  S.nodeStack.push(fromId);
  S.history.push(fromId.toUpperCase()+'\u2192'+optId);
  const nx=NODES[nextId];
  if(!nx){r();return;}
  if(nx.type==='stop'||nx.type==='warn'||nx.type==='optimal'){
    S.isEnd=true;
    S.endData=nx;
  } else {
    S.node=nextId;
    S.selected=null;
    S.pendingSit=null;
    S.showingSit=false;
  }
  r();
}

function advReflex(nextId,fromId){
  S.nodeStack.push(fromId);
  S.history.push(fromId.toUpperCase()+'\u2192R');
  const nx=NODES[nextId];
  if(!nx){r();return;}
  S.node=nextId;
  S.selected=null;
  S.pendingSit=null;
  S.showingSit=false;
  r();
}

function submitReflex(){
  S.reflexSubmitted=true;
  r();
}

function togReflex(i){
  S.reflexChecked=S.reflexChecked.includes(i)?S.reflexChecked.filter(x=>x!==i):[...S.reflexChecked,i];
  r();
}

function togHint(i){
  S.hintChecked=S.hintChecked.includes(i)?S.hintChecked.filter(x=>x!==i):[...S.hintChecked,i];
  r();
}

function submitFreitext(){
  if(!S.freitextValue.trim())return;
  S.freitextSubmitted=true;
  r();
}

function finishOpt(){
  S.isEnd=true;
  S.endData=END_OPTIMAL;
  r();
}

function reset(){
  S={node:'k1',history:[],nodeStack:[],selected:null,pendingSit:null,showingSit:false,isEnd:false,endData:null,reflexValue:'',reflexChecked:[],reflexSubmitted:false,freitextValue:'',freitextSubmitted:false,hintChecked:[]};
  r();
}

function goBack(){
  if(!S.nodeStack.length)return;
  const prev=S.nodeStack.pop();
  S.history.pop();
  S.node=prev;
  S.selected=null;
  S.pendingSit=null;
  S.showingSit=false;
  S.isEnd=false;
  S.endData=null;
  r();
}

r();
</script>
</body>
</html>
