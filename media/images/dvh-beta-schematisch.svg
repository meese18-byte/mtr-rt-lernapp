<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Schematisches kumulatives DVH</title>
<desc id="desc">Kumulatives Dosis-Volumen-Histogramm mit einer steilen PTV-Kurve und zwei früher abfallenden Risikoorgan-Kurven. Nur für Ausbildungszwecke.</desc>
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#102a43">DVH lesen – schematisches Beispiel</text>
<text x="450" y="61" text-anchor="middle" font-family="Arial" font-size="16" fill="#52606d">Kumulative Darstellung · nur für Ausbildungszwecke · keine klinischen Grenzwerte</text>

<g transform="translate(95 90)">
  <rect x="0" y="0" width="700" height="330" fill="#f8fafc" stroke="#cbd5e1"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="66" x2="700" y2="66"/><line x1="0" y1="132" x2="700" y2="132"/>
    <line x1="0" y1="198" x2="700" y2="198"/><line x1="0" y1="264" x2="700" y2="264"/>
    <line x1="100" y1="0" x2="100" y2="330"/><line x1="200" y1="0" x2="200" y2="330"/>
    <line x1="300" y1="0" x2="300" y2="330"/><line x1="400" y1="0" x2="400" y2="330"/>
    <line x1="500" y1="0" x2="500" y2="330"/><line x1="600" y1="0" x2="600" y2="330"/>
  </g>
  <line x1="0" y1="330" x2="700" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="330" stroke="#334155" stroke-width="2"/>
  <g font-family="Arial" font-size="14" fill="#52606d">
    <text x="-15" y="335" text-anchor="end">0</text><text x="-15" y="269" text-anchor="end">20</text>
    <text x="-15" y="203" text-anchor="end">40</text><text x="-15" y="137" text-anchor="end">60</text>
    <text x="-15" y="71" text-anchor="end">80</text><text x="-15" y="6" text-anchor="end">100</text>
    <text x="0" y="355" text-anchor="middle">0</text><text x="100" y="355" text-anchor="middle">10</text>
    <text x="200" y="355" text-anchor="middle">20</text><text x="300" y="355" text-anchor="middle">30</text>
    <text x="400" y="355" text-anchor="middle">40</text><text x="500" y="355" text-anchor="middle">50</text>
    <text x="600" y="355" text-anchor="middle">60</text><text x="700" y="355" text-anchor="middle">70</text>
  </g>
  <text x="350" y="397" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#334155">Dosis (Gy)</text>
  <text transform="translate(-62 165) rotate(-90)" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#334155">Volumen (%)</text>

  <!-- Curves: schematic only -->
  <path d="M0 5 C420 5,500 5,545 10 C575 16,590 60,600 145 C610 235,620 300,640 328" fill="none" stroke="#dc2626" stroke-width="6"/>
  <path d="M0 5 C65 55,110 110,165 165 C225 220,300 260,390 292 C470 315,540 326,610 330" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M0 5 C90 40,165 80,230 125 C300 175,355 230,430 270 C500 307,565 325,640 330" fill="none" stroke="#16a34a" stroke-width="5"/>

  <!-- illustrative readout guides -->
  <line x1="400" y1="0" x2="400" y2="330" stroke="#64748b" stroke-dasharray="6 6"/>
  <line x1="0" y1="198" x2="700" y2="198" stroke="#64748b" stroke-dasharray="6 6"/>
  <text x="405" y="320" font-family="Arial" font-size="14" fill="#475569">Beispiel: V40 ablesen</text>
</g>

<g transform="translate(160 455)" font-family="Arial" font-size="17">
  <line x1="0" y1="0" x2="42" y2="0" stroke="#dc2626" stroke-width="6"/><text x="55" y="6" fill="#334155">PTV</text>
  <line x1="190" y1="0" x2="232" y2="0" stroke="#2563eb" stroke-width="5"/><text x="245" y="6" fill="#334155">OAR A</text>
  <line x1="385" y1="0" x2="427" y2="0" stroke="#16a34a" stroke-width="5"/><text x="440" y="6" fill="#334155">OAR B</text>
</g>
</svg>