<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Planvergleich aus DVH und Isodosenbild</title>
<desc id="desc">Anonymisierte Lehrdarstellung eines Beckenplans. Links ein kumulatives DVH mit nicht benannten Kurven A bis H, rechts ein axialer Beckenquerschnitt mit Zielvolumen- und Isodosenkonturen. Die Darstellung ist didaktisch abgeleitet und kein klinischer Originalplan.</desc>
<defs>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#102a43}.h{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#52606d}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#334155;stroke-width:2}.small{font-size:14px}.lab{font-size:17px;font-weight:700}.legend{font-size:15px}.body{fill:#cfd4da;stroke:#64748b;stroke-width:2}.bone{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.soft{fill:#9ca3af;opacity:.35}.target{fill:#ef4444;opacity:.20;stroke:#ef4444;stroke-width:4}.iso105{fill:none;stroke:#ef4444;stroke-width:4}.iso100{fill:none;stroke:#22c55e;stroke-width:4}.iso95{fill:none;stroke:#10b981;stroke-width:4}.iso90{fill:none;stroke:#06b6d4;stroke-width:4}.iso80{fill:none;stroke:#3b82f6;stroke-width:4}.iso50{fill:none;stroke:#6366f1;stroke-width:4}.contour{fill:none;stroke:#f59e0b;stroke-width:3}
</style>
</defs>
<rect width="1600" height="760" fill="#f8fafc"/>
<text x="800" y="42" text-anchor="middle" class="t h">Plan lesen: DVH und Isodosen zusammenführen</text>
<text x="800" y="70" text-anchor="middle" class="t sub">Lehrdarstellung nach dem Muster eines anonymisierten Beckenplans – keine klinische Planfreigabe</text>

<!-- left DVH -->
<g transform="translate(30 105)">
<rect class="panel" width="760" height="600" rx="12"/>
<text x="28" y="42" class="t lab">A · Dosis-Volumen-Histogramm</text>
<g transform="translate(75 85)">
<rect x="0" y="0" width="620" height="400" fill="#f8fafc" stroke="#cbd5e1"/>
<g class="grid">
<line x1="0" y1="80" x2="620" y2="80"/><line x1="0" y1="160" x2="620" y2="160"/><line x1="0" y1="240" x2="620" y2="240"/><line x1="0" y1="320" x2="620" y2="320"/>
<line x1="103" y1="0" x2="103" y2="400"/><line x1="206" y1="0" x2="206" y2="400"/><line x1="309" y1="0" x2="309" y2="400"/><line x1="412" y1="0" x2="412" y2="400"/><line x1="515" y1="0" x2="515" y2="400"/>
</g>
<line class="axis" x1="0" y1="400" x2="620" y2="400"/><line class="axis" x1="0" y1="0" x2="0" y2="400"/>
<g class="t small">
<text x="-12" y="405" text-anchor="end">0</text><text x="-12" y="325" text-anchor="end">20</text><text x="-12" y="245" text-anchor="end">40</text><text x="-12" y="165" text-anchor="end">60</text><text x="-12" y="85" text-anchor="end">80</text><text x="-12" y="5" text-anchor="end">100</text>
<text x="0" y="425">0</text><text x="98" y="425">10</text><text x="200" y="425">20</text><text x="303" y="425">30</text><text x="406" y="425">40</text><text x="509" y="425">50</text><text x="606" y="425">60</text>
</g>
<text x="310" y="460" text-anchor="middle" class="t lab">Dosis (Gy)</text>
<text transform="translate(-55 200) rotate(-90)" text-anchor="middle" class="t lab">Volumen (%)</text>

<!-- target-like curves -->
<path d="M0 4 C405 4 500 5 545 12 C570 18 584 75 590 165 C596 260 603 350 620 400" fill="none" stroke="#dc2626" stroke-width="5"/>
<path d="M0 7 C385 7 490 10 540 20 C565 30 578 95 586 180 C595 275 604 360 620 400" fill="none" stroke="#ef4444" stroke-width="4"/>
<!-- OAR curves -->
<path d="M0 5 C60 15 105 70 145 150 C185 225 230 300 300 350 C370 385 445 398 535 400" fill="none" stroke="#eab308" stroke-width="4"/>
<path d="M0 5 C85 10 145 60 185 125 C235 205 295 285 370 335 C445 375 520 395 600 400" fill="none" stroke="#a3a31a" stroke-width="4"/>
<path d="M0 5 C35 90 60 150 90 205 C135 285 215 345 330 382 C420 398 510 400 620 400" fill="none" stroke="#f59e0b" stroke-width="4"/>
<path d="M0 5 C20 120 40 190 80 245 C135 320 230 370 355 392 C445 400 540 400 620 400" fill="none" stroke="#22c55e" stroke-width="4"/>
<path d="M0 5 C15 150 35 225 70 280 C120 340 210 382 340 398 C430 400 520 400 620 400" fill="none" stroke="#10b981" stroke-width="4"/>
<path d="M0 5 C5 180 20 270 45 325 C80 375 145 397 240 400 C360 400 490 400 620 400" fill="none" stroke="#6366f1" stroke-width="4"/>

<!-- curve IDs -->
<g class="t legend">
<text x="552" y="28" fill="#dc2626">A</text><text x="542" y="55" fill="#ef4444">B</text>
<text x="310" y="340" fill="#eab308">C</text><text x="380" y="322" fill="#a3a31a">D</text>
<text x="250" y="363" fill="#f59e0b">E</text><text x="180" y="382" fill="#22c55e">F</text>
<text x="120" y="394" fill="#10b981">G</text><text x="65" y="385" fill="#6366f1">H</text>
</g>
</g>
<text x="38" y="565" class="t sub">Kurven A–H sind bewusst nicht benannt. Nutze Form und Verlauf zur Einordnung.</text>
</g>

<!-- right isodose -->
<g transform="translate(810 105)">
<rect class="panel" width="760" height="600" rx="12"/>
<text x="28" y="42" class="t lab">B · Axiales Isodosenbild</text>
<g transform="translate(45 82)">
<!-- body/anatomy -->
<path class="body" d="M55 240 C75 105 200 40 335 45 C500 48 620 120 650 240 C670 330 635 410 555 455 C480 500 190 500 110 455 C40 415 25 330 55 240Z"/>
<ellipse class="bone" cx="185" cy="285" rx="78" ry="58"/><ellipse class="bone" cx="520" cy="285" rx="78" ry="58"/>
<ellipse class="soft" cx="335" cy="180" rx="82" ry="54"/><ellipse class="soft" cx="335" cy="340" rx="72" ry="55"/>
<path class="target" d="M255 235 Q335 190 415 235 Q445 295 414 355 Q335 395 256 355 Q225 295 255 235Z"/>
<!-- isodoses -->
<path class="iso105" d="M275 245 Q335 215 395 245 Q420 295 397 342 Q335 372 273 342 Q250 295 275 245Z"/>
<path class="iso100" d="M260 232 Q335 195 410 232 Q440 295 412 360 Q335 397 258 360 Q230 295 260 232Z"/>
<path class="iso95" d="M245 218 Q335 175 425 218 Q462 295 428 377 Q335 420 242 377 Q208 295 245 218Z"/>
<path class="iso90" d="M225 200 Q335 150 445 200 Q488 295 448 397 Q335 447 222 397 Q182 295 225 200Z"/>
<path class="iso80" d="M185 170 Q335 112 485 170 Q538 295 490 430 Q335 490 180 430 Q132 295 185 170Z"/>
<path class="iso50" d="M115 135 Q335 62 555 135 Q625 295 562 470 Q335 538 108 470 Q45 295 115 135Z"/>
<!-- structure contours -->
<ellipse class="contour" cx="335" cy="180" rx="80" ry="52"/>
<ellipse class="contour" cx="335" cy="340" rx="68" ry="53"/>
<g class="t small">
<text x="410" y="258" fill="#ef4444">105</text><text x="420" y="280" fill="#22c55e">100</text><text x="438" y="305" fill="#10b981">95</text>
<text x="460" y="330" fill="#06b6d4">90</text><text x="505" y="350" fill="#3b82f6">80</text><text x="570" y="370" fill="#6366f1">50</text>
</g>
</g>
<text x="38" y="565" class="t sub">Die räumliche Lage und Form der Dosis ist sichtbar; klinische Grenzwerte sind nicht vorgegeben.</text>
</g>
</svg>