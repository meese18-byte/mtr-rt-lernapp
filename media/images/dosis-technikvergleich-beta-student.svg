<ellipse cx="92" cy="170" rx="25" ry="17" class="oar"/><ellipse cx="232" cy="170" rx="25" ry="17" class="oar"/>
<rect x="125" y="110" width="74" height="80" rx="20" class="iso5"/>
<rect x="132" y="116" width="60" height="68" rx="16" class="iso4"/>
<rect x="138" y="122" width="48" height="56" rx="14" class="iso3"/>
<rect x="143" y="127" width="38" height="46" rx="12" class="iso2"/>
<rect x="148" y="132" width="28" height="36" rx="10" class="iso1"/>
<rect x="150" y="134" width="24" height="32" rx="8" class="ptv"/>
