<rect x="30" y="132" width="18" height="34" class="field"/><rect x="276" y="132" width="18" height="34" class="field"/>
</g>
<text x="28" y="407" class="t s"></text>
<text x="28" y="433" class="t s"></text>
<text x="28" y="459" class="t s"></text>
</g>

