<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Vier Dosisverteilungen im Vergleich</title>
<desc id="desc">Vier schematische axiale Beckenquerschnitte mit gleicher Anatomie und unterschiedlichen Applikationsprinzipien.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#334155"/></marker>
  <marker id="arcArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#7c3aed"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#102a43}.h{font-size:25px;font-weight:700}.s{font-size:17px}.cap{font-size:18px;font-weight:700}
    .body{fill:#f7dfae;stroke:#64748b;stroke-width:2}.bone{fill:#cbd5e1;stroke:#64748b;stroke-width:2}.oar{fill:#a78bfa;opacity:.55}.ptv{fill:#ef4444;stroke:#991b1b;stroke-width:3}
    .iso1{fill:#ef4444;opacity:.78}.iso2{fill:#facc15;opacity:.5}.iso3{fill:#34d399;opacity:.38}.iso4{fill:#38bdf8;opacity:.3}.iso5{fill:#6366f1;opacity:.22}
    .beam{stroke:#334155;stroke-width:5;fill:none;marker-end:url(#arrow)}.field{fill:#0f172a;opacity:.78}.seg{fill:#0f172a}.arc{stroke:#7c3aed;stroke-width:8;fill:none;marker-end:url(#arcArrow)}
    .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.num{fill:#0f4c81}.ntext{fill:#fff;font-family:Arial;font-size:28px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
  </style>
</defs>

<rect width="1600" height="620" fill="#f8fafc"/>
<text x="800" y="42" text-anchor="middle" class="t h">Vier Techniken – ordne selbst zu</text>
<text x="800" y="70" text-anchor="middle" class="t s">Schematische Lernabbildung – nicht zur klinischen Planbewertung</text>

<!-- Reusable anatomy by duplication -->
<!-- Panel 1 -->
<g transform="translate(20 95)">
<rect class="panel" width="375" height="495"/>
<circle cx="35" cy="36" r="23" class="num"/><text x="35" y="37" class="ntext">1</text>
<text x="70" y="43" class="t cap">Technik A</text>
<g transform="translate(25 80)">
<ellipse cx="162" cy="150" rx="135" ry="95" class="body"/>
